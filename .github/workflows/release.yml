name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import os
          import sys
          import tomllib

          tag = os.environ["TAG"]

          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]

          if tag != f"v{version}":
              sys.exit(f"Tag '{tag}' does not match pyproject.toml version 'v{version}'.")

          print(f"Tag '{tag}' matches pyproject.toml version.")
          EOF

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Run linter
        run: ruff check .

      - name: Run tests
        run: pytest

  build:
    name: Build package
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install "build>=1,<2"

      - name: Build package
        run: python -m build

      - name: Install twine
        run: python -m pip install "twine>=6,<7"

      - name: Validate package
        run: python -m twine check dist/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diffsage-package
          path: dist/

  publish:
    name: Publish package
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/diffsage

    permissions:
      id-token: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: diffsage-package
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1