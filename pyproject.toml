[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffsage"
version = "1.4.0"
description = "AI-powered Git workflow assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Gunitha Rathnayake" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Version Control :: Git",
]
keywords = [
    "git",
    "ai",
    "cli",
    "developer-tools",
    "commit",
]

# Typer 0.27.x is required for compatibility with modern Click releases.
# Earlier Typer versions exhibited incorrect handling of missing arguments
# with Click 8.4.x.
dependencies = [
    "typer>=0.27,<0.28",
    "click>=8.3.3,<9",
    "rich>=14,<15",
    "pydantic>=2.11,<3",
    "platformdirs>=4.0.0",
    "tomlkit>=0.13,<1",
    "httpx>=0.28,<0.29",
    "PyYAML>=6.0,<7",
    "google-genai>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<0.13",
    "pre-commit>=4,<5",
    "build>=1,<2",
    "pip-audit>=2,<3",
    "mypy>=1.18,<2",
]

[project.scripts]
diffsage = "diffsage.cli:app"

[project.urls]
Homepage = "https://github.com/GunithaR/Diffsage"
Repository = "https://github.com/GunithaR/Diffsage"
Issues = "https://github.com/GunithaR/Diffsage/issues"

[tool.pytest.ini_options]
# Ensure project-root imports (e.g. tests.helpers) work consistently
# when running `pytest`.
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ARG"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Temporary baseline: these modules have known type errors that are fixed by
# later remediation branches. Each branch removes its modules from this list.
[[tool.mypy.overrides]]
module = [
    # feature/ai-provider-hardening
    "diffsage.providers.gemini_provider",
    "diffsage.services.ai_service",
    # chore/cleanup
    "diffsage.ui.auth_view",
    "diffsage.ui.config_view",
]
ignore_errors = true
