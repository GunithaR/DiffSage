[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffsage"
version = "1.1.0"
description = "AI-powered Git workflow assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Gunitha Rathnayake" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Version Control :: Git",
]
keywords = [
    "git",
    "ai",
    "cli",
    "developer-tools",
    "commit",
]

# Click 8.4.x currently exhibits unexpected required-argument behavior
# with Typer 0.16.x. See GitHub Issue #1.
dependencies = [
    "typer>=0.16,<0.17",
    "click>=8.1.8,<8.2",
    "rich>=14,<15",
    "pydantic>=2.11,<3",
    "tomlkit>=0.13,<1",
    "httpx>=0.28,<0.29",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.1,<2",
    "google-genai>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<0.13",
    "pre-commit>=4,<5",
]

[project.scripts]
diffsage = "diffsage.cli:app"

[project.urls]
Homepage = "https://github.com/GunithaR/Diffsage"
Repository = "https://github.com/GunithaR/Diffsage"
Issues = "https://github.com/GunithaR/Diffsage/issues"

[tool.pytest.ini_options]
# Ensure project-root imports (e.g. tests.helpers) work consistently
# when running `pytest`.
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
